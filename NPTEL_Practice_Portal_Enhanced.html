<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPTEL Practice Portal</title>
<style>
:root{--bg:#0b0f1a;--card:#141b2d;--ink:#e6ecff;--mut:#8b96b8;--acc:#7cf5c8;--acc2:#7aa2ff;--bad:#ff7a93;--line:#2c3d66}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 0,#1d2a55,transparent 45%),var(--bg);color:var(--ink);min-height:100vh;padding:12px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;flex-wrap:wrap;gap:8px}
h1{font-size:20px;margin:0}
h1 span{color:var(--acc)}
h3{margin:16px 0 6px}
.card{background:var(--card);border:1px solid #22304f;border-radius:16px;padding:16px;margin:12px 0}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0e1424;color:var(--ink);margin:6px 0 10px;font:inherit}
button{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#06101f;border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:#0e1424;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:22px;display:block;color:var(--acc)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:#1f2a48;color:var(--mut);margin-left:6px}
.live{background:#123d33;color:var(--acc)}
.muted{color:var(--mut);font-size:14px}
.scn{border-left:3px solid var(--acc2);padding:4px 12px;margin:22px 0 8px;white-space:pre-wrap;line-height:1.5}
.opt{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.opt input{width:auto;margin:0 8px 0 0}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;z-index:2}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px;border-bottom:1px solid #22304f;text-align:left}
.good{color:var(--acc)}.bad{color:var(--bad)}

.menu{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:10px 0;position:sticky;top:0;z-index:5}
.menu a{color:var(--acc);text-decoration:none;padding:7px 10px;border-radius:8px}
.menu a:hover{background:#263452}
.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px}
.nav-questions{display:flex;gap:6px;flex-wrap:wrap}
.nav-questions a{display:inline-block;padding:7px 10px;border-radius:8px;border:1px solid var(--line);color:var(--acc);text-decoration:none}
body.light{--bg:#f2f5fb;--card:#ffffff;--ink:#172033;--mut:#58647b;--line:#d1d9e8;background:var(--bg);color:var(--ink)}
body.light input{background:#fff;color:#172033}
body.light .stat{background:#f7f9fd}
body.light .menu{background:#fff}
</style>
</head>
<body>
<header><h1>NPTEL <span>Practice</span> Portal</h1><button class="ghost" id="logout" style="display:none" onclick="logout()">Logout</button></header>
<main id="app"></main>
<script>
/* ============ QUESTION BANK (built in) ============

const BANK=[
{week:1,scenario:"Programming Beyond Coding",text:`Riya, a first-year Economics student, thinks programming is unnecessary because apps already exist for almost every task. Her professor explains that existing software can always be enhanced, customized or automated. Programming helps people in every field automate repetitive tasks, analyze data and build custom solutions. Different languages evolved for different problems: FORTRAN for scientific computing, COBOL for business, C for efficiency, C++ for object-oriented programming and Python for accessibility. In a gesture activity, students learn to read combinations of hand signals, just as a programmer gives precise instructions with symbols a computer understands. Riya realizes programming is a problem-solving skill useful in almost any profession.`,questions:[
{q:"Which statement best captures the professor's reason for learning programming despite the availability of many applications?",options:["Existing applications eliminate the need for programmers.","Programming enables people to create, improve, and customize solutions beyond existing applications.","Programming is useful only for developing mobile apps.","Learning programming is compulsory for every profession."],answers:[1]},
{q:"According to the professor, why have multiple programming languages evolved over time?",options:["Each country develops its own programming language.","Different languages were designed to solve different types of problems and improve programming.","Older programming languages cannot run on modern computers.","Every programmer must create a new programming language."],answers:[1]},
{q:"What was the primary purpose of the hand-gesture classroom activity?",options:["To improve students' memory.","To demonstrate that programming involves giving clear instructions using agreed-upon symbols.","To teach sign language.","To measure students' reaction speed."],answers:[1]},
{q:"According to the professor, what is the most effective way to become proficient in programming?",options:["Memorize every programming language before writing code.","Begin with advanced programming problems.","Practice regularly, stay motivated, and learn gradually through small steps.","Depend entirely on modern programming tools and IDEs."],answers:[2]},
{q:"Which conclusion would Riya most likely draw after attending the session?",options:["Programming is a problem-solving skill that can benefit people across many disciplines.","Programming is valuable only for software engineers.","Programming is primarily about memorizing the syntax of different languages.","Existing software packages make programming unnecessary."],answers:[0]}
]},
{week:1,scenario:"Teaching a Robot Efficiently: The Power of Loops",text:`A robotics club programs a robot to move forward and return, with each round a little farther than the last. One student writes a separate instruction for every movement. Another student notices the pattern repeats and suggests a loop with a variable that stores the current distance, increased by a fixed amount after every round. The instructor adds a second variable for the starting distance so the same program works for different challenges. The students learn that loops make programs flexible, easier to maintain and less error-prone.`,questions:[
{q:"Why did the second student recommend using a loop instead of writing every movement instruction separately?",options:["Loops allow repeated actions to be expressed with fewer instructions while preserving the same behavior.","Loops make the robot move faster.","Loops reduce the distance travelled by the robot.","Loops automatically correct programming errors."],answers:[0]},
{q:"In the improved program, what is the primary purpose of using a variable for the travel distance?",options:["To store the robot's battery level.","To allow the distance to change automatically after each repetition.","To count how many students are programming.","To increase the robot's speed."],answers:[1]},

{q:"Suppose a student removes the statement that updates the distance variable inside the loop. Which outcome is most likely?",options:["The robot will continue repeating the same movement distance in every round.","The robot will stop after the first movement.","The robot will automatically choose new distances.","The loop will immediately terminate."],answers:[0]},

{q:"What is the purpose of the turn 15 degrees block in this program?",options:["It changes the sprite's direction before the second movement.","It changes the sprite's position by 15 steps.","It changes the direction for the entire program, including after the point in direction block.","It makes the sprite move automatically."],answers:[0]},
{q:"Suppose the point in direction 90° block is removed while all other blocks stay unchanged. Which statement is most likely true?",options:["The final movement will continue in the direction established by the earlier turn.","The sprite will not execute the last move.","The sprite will return to its starting position.","The program will stop with an error."],answers:[0]},

]},

/* ============ STORAGE ============ */
const K={students:'npp_students',admin:'npp_admin',tests:'npp_tests',session:'npp_session',results:'npp_results'};
const app=document.getElementById('app');
let att=null;
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function val(id){return document.getElementById(id).value.trim()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(iso){return iso?new Date(iso).toLocaleString():'Never'}
function students(){return load(K.students)||{}}
async function hash(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function bankCount(){return BANK.reduce((a,s)=>a+s.questions.length,0)}

function render(){
  const s=load(K.session);
  document.getElementById('logout').style.display=s?'inline-block':'none';
  if(!s)return loginView('student');
  if(s.role==='admin')return adminView();
  studentView(s.id);
}
function logout(){localStorage.removeItem(K.session);render()}
function toggleTheme(){document.body.classList.toggle('light');save('npp_theme',document.body.classList.contains('light')?'light':'dark')}
function showMistakes(){
 const s=load(K.session);if(!s||s.role!=='student')return;
 const rs=(load(K.results)||[]).filter(r=>r.rollno===s.id);
 const qs=rs.flatMap(r=>(r.review||[]).filter(q=>!q.isCorrect).map(q=>({...q,title:r.title})));
 app.innerHTML=`<nav class="menu"><b>🧠 Mistake Questions</b><button class="ghost" onclick="render()">Back to dashboard</button></nav><p class="muted">Questions answered incorrectly or left unanswered, with the correct answer for revision.</p>${qs.length?qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b><p class="muted">${esc(q.title)} · Week ${q.week}</p><p><b>Correct answer:</b> ${q.correctAnswers.map(n=>esc(q.options[n])).join(', ')}</p></div>`).join(''):'<div class="card">Great! No mistakes recorded yet.</div>'}`;
}

/* ============ LOGIN ============ */
function loginView(tab){
  const admin=load(K.admin);
  const tabs=`<div class="row"><button class="${tab==='student'?'':'ghost'}" onclick="loginView('student')">Student</button><button class="${tab==='admin'?'':'ghost'}" onclick="loginView('admin')">Admin</button></div>`;
  let body;
  if(tab==='student'){
    body=`<h3>Student login or register</h3>
    <input id="sr" placeholder="Roll number"><input id="sn" placeholder="Full name (new account only)">
    <input id="sp" type="password" placeholder="Password (6+ characters)">
    <button onclick="studentLogin()">Login</button><button class="ghost" onclick="studentRegister()">Register</button>`;
  }else if(admin){
    body=`<h3>Admin login</h3><p class="muted">Username: SURENDHAR</p>
    <input id="ap" type="password" placeholder="Admin password"><button onclick="adminLogin()">Enter</button>`;
  }else{
    body=`<h3>Create admin password (first time only)</h3><p class="muted">Username is SURENDHAR. Use at least 8 characters.</p>
    <input id="ap" type="password" placeholder="New admin password"><input id="ap2" type="password" placeholder="Repeat password">
    <button onclick="adminSetup()">Create admin</button>`;
  }
  app.innerHTML=`<div class="card">${tabs}${body}</div>`;
}
async function studentRegister(){
  const r=val('sr'),n=val('sn'),p=val('sp');
  if(!r||!n||p.length<6)return alert('Enter roll number, name and a password of 6+ characters.');
  const db=students();
  if(db[r])return alert('This roll number is already registered. Please login.');

}

/* ============ AUTO TEST GENERATION ============
   Takes scenarios from ANY week, each giving 3 or 4 sub-questions,
   until exactly `total` questions are reached. Returns null if impossible. */
function buildPaper(total, weeks){
  // Every student receives a fresh paper generated at test start.
  const allowed = BANK.filter(s => !weeks || !weeks.length || weeks.includes(s.week));
  const pool = allowed.map(s => ({...s, questions:[...s.questions].sort(()=>Math.random()-.5)}))
                      .sort(()=>Math.random()-.5);
  const paper=[]; let need=total;
  for(const s of pool){
    if(need===0) break;
    const k=Math.min(s.questions.length, need);
    if(k>0){ paper.push({week:s.week,scenario:s.scenario,text:s.text,questions:s.questions.slice(0,k)}); need-=k; }
  }
  return need===0 ? paper : null;
}
function maxPossible(){ return bankCount(); }
function canBuild(total){ return Number.isInteger(total) && total>0 && total<=bankCount(); }

    ${list.map(s=>{const mine=res.filter(r=>r.rollno===s.roll);const avg=mine.length?Math.round(mine.reduce((a,r)=>a+(r.percentage??r.score),0)/mine.length):0;
      return `<tr><td>${esc(s.roll)}</td><td>${esc(s.name)}</td><td>${fmt(s.lastLogin)}</td><td>${mine.length}</td><td>${avg}%</td></tr>`}).join('')}

    ${res.map(r=>`<tr><td>${esc(r.rollno)}</td><td>${esc(r.title)}</td><td class="good">${r.correct}</td><td class="bad">${r.wrong}</td><td>${r.score}%</td></tr>`).join('')}

function createTest(){
  const title=val('tt'),d=val('td'),t=val('tm'),min=+val('tdur'),cnt=+val('tcnt');
  const weeks=[...document.querySelectorAll('.week-pick:checked')].map(x=>+x.value);
  const allowed=BANK.filter(s=>!weeks.length||weeks.includes(s.week)).reduce((n,s)=>n+s.questions.length,0);
  if(!title||!d||!t||!min||!cnt)return alert('Fill in every field.');
  if(cnt>allowed)return alert('Selected weeks contain only '+allowed+' questions. Reduce question count or choose more weeks.');
  const tests=load(K.tests)||[];
  tests.push({id:'t'+Date.now(),title,start:new Date(d+'T'+t).toISOString(),minutes:min,count:cnt,launched:false,weeks});
  save(K.tests,tests);alert('Test created. A different randomized paper will be generated for each student.');render();
}
function launch(id){
  const tests=load(K.tests)||[],t=tests.find(x=>x.id===id);
  t.launched=true;save(K.tests,tests);render();
}

/* ============ STUDENT DASHBOARD ============ */
function studentView(id){
  const st=students()[id];
  if(!st){localStorage.removeItem(K.session);return render()}
  const now=Date.now();
  const tests=(load(K.tests)||[]).filter(t=>t.launched);
  const res=(load(K.results)||[]).filter(r=>r.rollno===id);
  const avg=res.length?Math.round(res.reduce((a,r)=>a+(r.percentage??r.score),0)/res.length):0;
  const best=res.length?Math.max(...res.map(r=>r.percentage??r.score)):0;

      :status==='Open'?`<button onclick="startTest('${t.id}')">Start test</button>`:'';

      <div class="muted">${fmt(t.start)} · ${t.minutes} min · ${t.count} questions</div>${action}</div>`;
  }).join('');
  app.innerHTML=`
  <nav class="menu"><b>🎓 Student Dashboard</b><div><button class="ghost" onclick="toggleTheme()">☀ / ☾ Theme</button><button class="ghost" onclick="showMistakes()">Mistake Questions</button></div></nav><div class="card"><b>${esc(st.name)}</b> · Roll ${esc(id)}
    <div class="muted">Joined ${fmt(st.joined)} · Last login ${fmt(st.lastLogin)}</div>

      <div class="stat"><b>${avg}%</b>Average</div>
      <div class="stat"><b>${best}%</b>Best</div>
      <div class="stat"><b>${res.reduce((a,r)=>a+r.correct,0)}</b>Correct answers</div>

  <h3>Open tests</h3>${cards||'<p class="muted">No tests are open right now.</p>'}

    <tr><th>Test</th><th>Date</th><th>Correct</th><th>Wrong</th><th>Not answered</th><th>Negative</th><th>Marks</th><th>Percentage</th></tr>
    ${res.map(r=>`<tr><td>${esc(r.title)}</td><td>${new Date(r.at).toLocaleDateString()}</td><td class="good">${r.correct}</td><td class="bad">${r.wrong}</td><td>${r.unanswered}</td><td>−${(r.negativeMarks||0).toFixed(2)}</td><td>${r.score??r.percentage}</td><td>${r.percentage??r.score}%</td></tr>`).join('')}
    </table>`:'<p class="muted">You have not attended any test yet.</p>'}`;
}

/* ============ TEST TAKING ============ */
function startTest(id){
  const sess=load(K.session);
  const t=(load(K.tests)||[]).find(x=>x.id===id);
  const now=Date.now(),start=new Date(t.start).getTime(),windowEnd=start+t.minutes*60000;
  if(now<start||now>windowEnd)return alert('This test is not open right now.');
  if((load(K.results)||[]).some(r=>r.testId===id&&r.rollno===sess.id))return alert('You already attended this test.');
  const flat=[];
  // Generate the paper for this student now, not when the admin creates the test.
  const paper=buildPaper(t.count,t.weeks||[]);
  if(!paper)return alert('Not enough questions in the selected weeks.');
  paper.forEach((s,si)=>s.questions.forEach((q,qi)=>flat.push({si,qi})));
  const deadline=Math.min(now+t.minutes*60000,windowEnd);
  att={t:{...t,paper},answers:{},flat,deadline,tabWarnings:0,tabLimit:3,confirmed:false};
  app.innerHTML=`<div class="card"><h3>Before you begin</h3><p>Read and agree to the test rules:</p>
    <label class="opt"><input type="checkbox" id="agree1"> I will not switch tabs or leave the test window.</label>
    <label class="opt"><input type="checkbox" id="agree2"> I understand that wrong answers lose 0.50 marks and unanswered questions get 0 marks.</label>
    <label class="opt"><input type="checkbox" id="agree3"> I understand that repeated tab switches may automatically submit my test.</label>
    <button onclick="confirmStart()">I agree — Start test</button><button class="ghost" onclick="render()">Cancel</button></div>`;
}
function confirmStart(){
  if(!document.getElementById('agree1').checked||!document.getElementById('agree2').checked||!document.getElementById('agree3').checked)return alert('Please tick all agreement boxes before starting.');
  att.confirmed=true;viewTest();att.timer=setInterval(tick,1000);
}
function viewTest(){
  const {t}=att;
  let body='';
  t.paper.forEach((s,si)=>{
    body+=`<div class="scn"><span class="muted">Week ${s.week} · ${esc(s.scenario)}</span><br>${esc(s.text)}</div>`;
    s.questions.forEach((q,qi)=>{
      const multi=q.answers.length>1,no=att.flat.findIndex(f=>f.si===si&&f.qi===qi)+1;
      body+=`<div class="card"><b>Q${no}. ${esc(q.q)}</b><p class="muted">${multi?'Select all correct answers.':'Choose one answer.'}</p>${q.options.map((o,oi)=>
        `<label class="opt"><input type="${multi?'checkbox':'radio'}" name="q${si}_${qi}" onchange="pick(${si},${qi},${oi},${multi})">${esc(o)}</label>`).join('')}</div>`;
    });
  });
  app.innerHTML=`<nav class="menu test-menu"><b>${esc(t.title)}</b><span class="tag live" id="timer">--:--</span><button class="ghost" onclick="toggleTheme()">☀/☾</button></nav>
    <div class="card"><b>Question navigation</b><div class="nav-questions">${att.flat.map((f,i)=>`<a href="#q${f.si}_${f.qi}">${i+1}</a>`).join('')}</div><p class="muted">Tab switches: <span id="tabCount">0</span> / ${att.tabLimit}</p></div>
    ${body.replace(/<div class="card"><b>Q(\\d+)\\./g,'<div class="card" id="q$1"><b>Q$1.')}
    <button onclick="submitTest(false)">Submit test</button>`;
  tick();
}
function handleVisibility(){
  if(!att||!att.confirmed||document.hidden)return;
  att.tabWarnings++;
  const counter=document.getElementById('tabCount');if(counter)counter.textContent=att.tabWarnings;
  if(att.tabWarnings<att.tabLimit)alert('⚠ Warning '+att.tabWarnings+'/'+att.tabLimit+': Do not switch tabs. Another switch may auto-submit your test.');
  else {alert('⚠ Tab-switch limit reached. Your test will be submitted automatically.');submitTest(true,'Tab-switch limit reached');}
}
document.addEventListener('visibilitychange',handleVisibility);
window.addEventListener('blur',()=>{ /* visibilitychange is the primary tab-switch signal */ });

function pick(si,qi,oi,multi){
  const k=si+'_'+qi,cur=att.answers[k]||[];
  att.answers[k]=multi?(cur.includes(oi)?cur.filter(x=>x!==oi):[...cur,oi]):[oi];
}
function tick(){
  const el=document.getElementById('timer');
  if(!att)return;
  if(!el){clearInterval(att.timer);return}
  const left=Math.max(0,Math.floor((att.deadline-Date.now())/1000));
  el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  if(left===0)submitTest(true);
}
function submitTest(auto,reason=''){
  if(!att)return;
  clearInterval(att.timer);
  const {t,answers}=att;
  let correct=0,wrong=0,unanswered=0;
  const review=[];
  t.paper.forEach((s,si)=>s.questions.forEach((q,qi)=>{
    const given=answers[si+'_'+qi]||[];
    const same=given.length>0&&given.slice().sort().join(',')===q.answers.slice().sort().join(',');
    if(given.length===0)unanswered++;else if(same)correct++;else wrong++;
    review.push({week:s.week,scenario:s.scenario,q:q.q,options:q.options,given,correctAnswers:q.answers,isCorrect:same});
  }));
  const total=correct+wrong+unanswered,negative=wrong*0.5;
  const raw=correct-negative,maxMarks=total,score=Math.max(0,raw);
  const percentage=maxMarks?Math.round(score/maxMarks*100):0;
  const sess=load(K.session);
  const result={testId:t.id,title:t.title,rollno:sess.id,correct,wrong,unanswered,total,negativeMarks:negative,score,percentage,rawScore:raw,maxMarks,at:new Date().toISOString(),auto,reason,review};
  const res=load(K.results)||[];res.push(result);save(K.results,res);
  att=null;showResult(result,auto);
}
function showResult(r,auto){
  const detail=(r.review||[]).map((q,i)=>`<div class="card"><b>Q${i+1}. ${esc(q.q)}</b><p class="${q.isCorrect?'good':'bad'}">${q.isCorrect?'✓ Correct':q.given.length?'✗ Wrong':'— Not answered'}</p>
    <p><b>Your answer:</b> ${q.given.length?q.given.map(n=>esc(q.options[n])).join(', '):'Not answered'}</p>
    <p><b>Correct answer:</b> ${q.correctAnswers.map(n=>esc(q.options[n])).join(', ')}</p>
    <p class="muted">Week ${q.week} · ${esc(q.scenario)}</p></div>`).join('');
  app.innerHTML=`<nav class="menu"><b>📊 Score Card</b><button class="ghost" onclick="render()">Dashboard</button></nav>
    <div class="card"><h3>${auto?'Auto-submitted. ':''}Test finished: ${esc(r.title)}</h3>${r.reason?`<p class="bad">${esc(r.reason)}</p>`:''}
      <div class="stats" style="margin-top:12px">
        <div class="stat"><b class="good">${r.correct}</b>Correct</div><div class="stat"><b class="bad">${r.wrong}</b>Wrong</div>
        <div class="stat"><b>${r.unanswered}</b>Unanswered</div><div class="stat"><b>${r.score}/${r.maxMarks}</b>Final marks</div>
        <div class="stat"><b>${r.percentage}%</b>Percentage</div><div class="stat"><b class="bad">−${r.negativeMarks.toFixed(2)}</b>Negative marks</div>
      </div><p class="muted">Scoring: +1 for correct, −0.50 for wrong, 0 for unanswered. Final score is not allowed below zero.</p>
      <button onclick="render()">Back to dashboard</button><button class="ghost" onclick="document.getElementById('review').hidden=false">Review answers</button></div>
    <section id="review" hidden><h3>Answer explanations</h3><p class="muted">The correct option is shown for every question. Coding scenarios include numbered lines in the question stem.</p>${detail}</section>`;
}

if(load('npp_theme')==='light')document.body.classList.add('light');
render();
</script>
